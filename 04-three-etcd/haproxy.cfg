global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout check 1s
    timeout queue 1s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend postgres_write
    bind *:5000
    default_backend patroni_write

backend patroni_write
    option httpchk
    option log-health-checks

    http-check connect
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200

    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

    server pg-01 pg-01:5432 check port 8008 resolvers docker init-addr libc,none
    server pg-02 pg-02:5432 check port 8008 resolvers docker init-addr libc,none

listen stats
    bind *:7000
    mode http
    option httplog
    stats enable
    stats uri /stats
    stats refresh 1s
